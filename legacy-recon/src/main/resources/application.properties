spring.application.name=legacy-recon

# 事实层/图谱层共用 SQLite（ADR-004 MVP 单机降级；Neo4j 为生产扩展项）
spring.datasource.url=jdbc:sqlite:${legacy-recon.data-dir:data}/legacy-recon.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=never

server.port=8080

# JSON 无值字段省略，保持文档结构
spring.jackson.default-property-inclusion=non_null