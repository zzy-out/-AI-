spring.application.name=legacy-recon

# 事实层/图谱层共用 SQLite（ADR-004 MVP 单机降级；Neo4j 为生产扩展项）
spring.datasource.url=jdbc:sqlite:${legacy-recon.data-dir:data}/legacy-recon.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=never

server.port=${LEGACY_RECON_PORT:8080}
server.address=${LEGACY_RECON_BIND:0.0.0.0}

# ---- 生产：优雅停机 ----
# 停止先拒新请求，等待进行中请求完成（含 WebSocket 广播与 LLM 调用）
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ---- 生产：Tomcat 连接治理 ----
server.tomcat.max-connections=10000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-keep-alive-requests=200
server.error.include-message=never
server.error.include-stacktrace=never

# 代理/网关场景下正确解析客户端地址
server.forward-headers-strategy=framework

# ---- 管理端点（生产监控）----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator
management.metrics.enable.jvm=true
management.info.git.mode=full

# ---- 日志 ----
logging.level.root=INFO
logging.level.com.legacyrecon=INFO
logging.level.org.springframework=WARN
logging.file.name=${legacy-recon.data-dir:data}/logs/legacy-recon.log
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# ---- 上传/请求体治理 ----
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.max-http-request-header-size=16KB

# JSON 无值字段省略，保持文档结构
spring.jackson.default-property-inclusion=non_null

# 应用信息（actuator /info）
info.app.name=legacy-recon
info.app.description=遗留系统 AI 重构与文档生成器
info.app.ucm=01/02/03/04 设计文档实现